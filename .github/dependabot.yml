version: 2
updates:
  # Expo pins compatible native versions; review bumps with `npx expo install --check`.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One PR at a time; all updates land in a single batched PR.
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      all-actions:
        patterns:
          - "*"
