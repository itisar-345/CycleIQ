name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit, backtest gate & database tests
        run: npm test

      - name: Screen tests (Jest + Testing Library, incl. accessibility checks)
        run: npm run test:ui -- --ci

      - name: Expo project health
        run: npx expo-doctor

  bundle:
    name: Production bundles (iOS, Android, web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Catches module-resolution errors that typechecking can't (e.g. native packages, subpath exports).
      - name: Export JS bundles
        run: npx expo export --platform ios --platform android --platform web --output-dir /tmp/bundle-check
